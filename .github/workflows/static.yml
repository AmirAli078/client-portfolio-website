name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
      PHONE_DISPLAY: ${{ vars.PHONE_DISPLAY }}
      EMAIL: ${{ vars.EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject variables
        run: |
          if [ -n "$WHATSAPP_NUMBER" ]; then
            sed -i "s/923001234567/$WHATSAPP_NUMBER/g" lawyer-portfolio/index.html lawyer-portfolio/js/script.js
          fi
          if [ -n "$PHONE_DISPLAY" ]; then
            sed -i "s/+92 300 1234567/$PHONE_DISPLAY/g" lawyer-portfolio/index.html
          fi
          if [ -n "$EMAIL" ]; then
            sed -i "s/info@ahmedrazakhan.com/$EMAIL/g" lawyer-portfolio/index.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lawyer-portfolio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
